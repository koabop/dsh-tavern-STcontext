name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      # The distributed plugin includes its runtime; tests must work without npm install.
      - run: npm test
      - name: Verify the installable release archive
        run: |
          npm run package:release -- HEAD "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/$(node -p 'const pkg = require("./package.json"); pkg.name + "-v" + pkg.version + ".zip"')"
          unzip -tq "$archive"
          unzip -p "$archive" NOTICE | cmp - NOTICE
          unzip -p "$archive" lib/vendor/LICENSES.txt | cmp - lib/vendor/LICENSES.txt
